name: Verify integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2
      - name: Verify pairwise rider garment clearance
        run: npm run test:rider-qa
      - run: GITHUB_SHA="$(git rev-parse HEAD)" npm run build
      - run: npx playwright install --with-deps chromium
      - run: GITHUB_SHA="$(git rev-parse HEAD)" node scripts/smoke.mjs --no-build
      - name: Verify experimental scenes against the production build
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5174/ > /dev/null
          node scripts/windline-gameplay-check.mjs http://127.0.0.1:5174
          node scripts/windline-flow-check.mjs http://127.0.0.1:5174
          node scripts/windline-reticle-check.mjs http://127.0.0.1:5174
          # Owner-approved neutral dot: zero prediction work; actual casts and
          # original collision/swing CPU gates remain in the checks above/below.
          node scripts/windline-reticle-motion-check.mjs http://127.0.0.1:5174
          node scripts/editor-check.mjs http://127.0.0.1:5174
          # The approved audio harness imports its offline QA helper from /src/;
          # run it against this same exact checkout through Vite's source server.
          npm run dev -- --host 127.0.0.1 --port 5411 --strictPort > /tmp/audio-dev.log 2>&1 &
          audio_dev_pid=$!
          trap 'kill "$preview_pid" "$audio_dev_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5411/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5411/ > /dev/null
          node scripts/audio-qa.mjs http://127.0.0.1:5411 /tmp/driftwing-reticle-audio-qa
          kill "$audio_dev_pid" 2>/dev/null || true
          node scripts/windline-hud-layout-check.mjs http://127.0.0.1:5174
          node scripts/windline-hud-layout-check.mjs http://127.0.0.1:5174 --device=gamepad --review-viewports
          node scripts/windline-performance-check.mjs http://127.0.0.1:5174 --assert-cost --evidence=ci
          node scripts/windhaven-smoke.mjs http://127.0.0.1:5174
          node scripts/sky-lance-check.mjs http://127.0.0.1:5174
          node scripts/sky-lance-check.mjs http://127.0.0.1:5174 --motion-only
          node scripts/sky-lance-check.mjs http://127.0.0.1:5174 --control-only
          node scripts/sky-lance-check.mjs http://127.0.0.1:5174 --input-only
          node scripts/sky-lance-check.mjs http://127.0.0.1:5174 --spin-only --expect-retained --evidence=integration
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-browser-evidence
          path: |
            shots/
            /tmp/preview.log
            /tmp/driftwing-*-browser-check.json
            /tmp/driftwing-spin-integration.json
            /tmp/driftwing-windline-performance-ci.json
            /tmp/driftwing-reticle-audio-qa/
            /tmp/driftwing-editor-evidence/
            /tmp/audio-dev.log
          retention-days: 30
