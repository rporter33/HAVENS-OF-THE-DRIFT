<g font-family="Georgia,serif" fill="#FCF0D6"><text x="42" y="58" font-size="35" font-weight="bold">DRIFTWING • WINDLINE BRACER</text><text x="43" y="89" font-size="19">SKY LANCE THROW → STATIC ANCHOR → FIXED-LENGTH TETHER → SWING → RELEASE</text></g>
<g font-family="Arial,sans-serif" font-size="19" fill="#17364C">
