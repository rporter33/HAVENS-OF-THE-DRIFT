<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Driftwing Windline Bracer and Sky Lance traversal schematic</title>
<desc id="desc">A ceremonial Sky Lance anchors to a static Greco-Mediterranean stone arch. Tether routes through the rider's harness and bracer; the rider swings along a circular arc and releases with tangential momentum. Lower panels show the bracer and the six traversal states.</desc>
