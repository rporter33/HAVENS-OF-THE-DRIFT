<g font-family="Arial,sans-serif" font-size="20" fill="#DCE5EB">
<text x="666" y="582">1  Aim</text><text x="856" y="582">2  Throw lance</text><text x="1091" y="582">3  Anchor</text>
<text x="666" y="626">4  Pendulum swing</text><text x="940" y="626">5  Release</text>
<text x="666" y="673">6  Recover lance / reset</text></g>
<text x="664" y="712" font-family="Arial,sans-serif" fill="#F4DFB6" font-size="17">World-static surfaces only • 120 Hz deterministic step • M1-independent</text>
