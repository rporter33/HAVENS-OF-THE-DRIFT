<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b2a3f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cpath d=%22M4 36 Q20 14 32 30 Q44 14 60 36 Q44 28 32 44 Q20 28 4 36Z%22 fill=%22%23e8b85a%22/%3E%3C/svg%3E" />
    <meta name="description" content="Race and explore on wyvernback across a floating archipelago." />
    <title>Havens of the Drift</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a3f; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; outline: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      /* Shown while the archipelago is built (about a second on a desktop). */
      #boot {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; color: #f3e3bf;
        background: radial-gradient(ellipse at 50% 120%, #e9a86a 0%, #7b5a86 38%, #233452 75%, #141d33 100%);
        font: 600 clamp(28px, 6vh, 64px) Georgia, 'Times New Roman', serif; letter-spacing: 0.18em;
        transition: opacity 0.8s ease;
      }
      #boot small { font: italic 400 clamp(13px, 2vh, 18px) Georgia, serif; letter-spacing: 0.08em; opacity: 0.75; }
      #boot .wind { width: min(320px, 50vw); height: 2px; overflow: hidden; border-radius: 2px; background: #f3e3bf22; }
      #boot .wind::after {
        content: ''; display: block; width: 40%; height: 100%; background: #f3e3bf;
        animation: boot-wind 1.4s ease-in-out infinite;
      }
      @keyframes boot-wind { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { #boot .wind::after { animation: none; width: 100%; opacity: 0.4; } }
      #boot.done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="boot" role="status" aria-live="polite">DRIFTWING<div class="wind"></div><small>Gathering the wind…</small></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
